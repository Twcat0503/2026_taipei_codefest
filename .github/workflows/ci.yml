name: CI

on:
  pull_request:
  push:
    # main plus the long-lived workstream branches (see CONTRIBUTING.md)
    branches: [main, frontend, agent, model, tools]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      agent: ${{ steps.filter.outputs.agent }}
      kotlin_tts: ${{ steps.filter.outputs.kotlin_tts }}
      python_tts: ${{ steps.filter.outputs.python_tts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Decide which stacks to check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          else
            # Pushes to long-lived branches check everything that exists.
            changed="$(git ls-files)"
          fi

          workflow_changed=false
          if grep -qE '^\.github/workflows/' <<<"$changed"; then workflow_changed=true; fi

          frontend=false
          if [ -f frontend/package.json ] &&
            { [ "$workflow_changed" = true ] || grep -qE '^frontend/' <<<"$changed"; }; then
            frontend=true
          fi

          flutter=false
          if [ "$workflow_changed" = true ] ||
            grep -qE '^(lib|test|integration_test|android|assets|fonts)/|^tools/(llm|asr|tts)-android/|^(pubspec\.(yaml|lock)|analysis_options\.yaml|\.fvmrc)$' <<<"$changed"; then
            flutter=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          agent=false
          if [ -f frontend/agent-mvp/package.json ] &&
            { [ "$workflow_changed" = true ] || grep -qE '^(frontend/agent-mvp|tools/townpass)/' <<<"$changed"; }; then
            agent=true
          fi
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

          kotlin_tts=false
          if [ "$workflow_changed" = true ] ||
            grep -qE '^android/app/src/(main|test)/kotlin/com/example/townpass/tts/' <<<"$changed"; then
            kotlin_tts=true
          fi
          echo "kotlin_tts=$kotlin_tts" >> "$GITHUB_OUTPUT"

          python_tts=false
          if [ "$workflow_changed" = true ] || grep -qE '^tools/tts-android/' <<<"$changed"; then
            python_tts=true
          fi
          echo "python_tts=$python_tts" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend flutter=$flutter"

  frontend:
    name: Frontend (lint, format, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Installs the Node and pnpm versions pinned in frontend/mise.toml.
      - uses: jdx/mise-action@v5
        with:
          working_directory: frontend
          github_token: ${{ github.token }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  agent:
    name: Agent MVP (lint, format, test, build)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/agent-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: frontend/agent-mvp
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: tools/townpass
      - run: pnpm typecheck
        working-directory: tools/townpass
      - run: pnpm test
        working-directory: tools/townpass
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  flutter:
    name: Flutter (format, analyze, test, APK)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      # Run before build_runner so generated files are not checked.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code (json_serializable, flutter_gen)
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      - name: Prepare Android NDK
        run: |
          # yes exits on SIGPIPE after sdkmanager finishes; retain sdkmanager's status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456"

      # Compile native Kotlin and merge manifests; model runtime is tested on a device.
      - run: flutter build apk --debug --target-platform android-arm64

  # TtsLifecycleTest.kt is a plain main() program (no JUnit, no Android), so
  # `gradlew testDebugUnitTest` would run nothing; compile it with kotlinc instead.
  kotlin-tts:
    name: Kotlin TTS lifecycle tests
    needs: changes
    if: needs.changes.outputs.kotlin_tts == 'true'
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: "2.4.0"
      # Official release asset digest (github.com/JetBrains/kotlin, v2.4.0).
      KOTLIN_SHA256: ba1b9e6eb6ddc3275079224f2e9ea4a2b02eef7d59ce2d38404f04b22613c20a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install kotlinc
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Compile and run TtsLifecycleTest
        run: |
          set -euo pipefail
          tts=android/app/src/main/kotlin/com/example/townpass/tts
          kotlinc -include-runtime -d "$RUNNER_TEMP/tts-lifecycle.jar" \
            "$tts/TtsOperations.kt" "$tts/TtsStartup.kt" "$tts/TtsChild.kt" \
            android/app/src/test/kotlin/com/example/townpass/tts/TtsLifecycleTest.kt
          java -cp "$RUNNER_TEMP/tts-lifecycle.jar" com.example.townpass.tts.TtsLifecycleTestKt

  python-tts:
    name: Python TTS tool tests
    needs: changes
    if: needs.changes.outputs.python_tts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # test_model_tools.py has one real weights-only torch.load check.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # test_tokenizer_repair.py needs gguf and a llama shared library built on a
      # model machine, so it is not run here (see tools/tts-android/README.md).
      - name: Run host tests
        run: |
          set -euo pipefail
          for t in test_model_tools test_install_models test_build_publish; do
            python -I -B -X utf8 "tools/tts-android/$t.py"
          done

  # Single required check for branch protection; skipped jobs count as passing.
  result:
    name: CI result
    needs: [changes, frontend, agent, flutter, kotlin-tts, python-tts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
